name: Fix byPhone ternary
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-byphone.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch incomplete ternary
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/lib/studio-sync.ts")
          t = p.read_text()
          old = """      const byPhone =
        wantPhone.length >= 10
                                ? payload.clients.find((c) => !c.telegramId && digitsPhone(c.phone).endsWith(wantPhone.slice(-10)))
      const match = byName ?? byPhone;"""
          new = """      const byPhone =
        wantPhone.length >= 10
          ? payload.clients.find((c) => !c.telegramId && digitsPhone(c.phone).endsWith(wantPhone.slice(-10)))
          : undefined;
      const match = byName ?? byPhone;"""
          if old not in t:
              # already fixed?
              if ": undefined;\n      const match = byName ?? byPhone" in t:
                  print("already fixed")
              else:
                  raise SystemExit("pattern not found")
          else:
              p.write_text(t.replace(old, new, 1))
              print("fixed")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/studio-sync.ts
          rm -f .github/workflows/fix-byphone.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(sync): complete byPhone ternary in pullStudio"
          git push origin main
