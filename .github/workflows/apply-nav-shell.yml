name: Apply nav shell

on:
  workflow_dispatch:
  push:
    branches: [fix/nav-shell]
    paths:
      - "scripts/ci/patch-nav-shell.py"
      - ".github/workflows/apply-nav-shell.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nav-shell
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-nav-shell.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/mini-app.tsx
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(nav): client bottom nav with food tab"
          git push origin HEAD:fix/nav-shell
