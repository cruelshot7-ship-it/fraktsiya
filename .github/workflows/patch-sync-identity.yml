name: Patch sync identity
on:
  push:
    branches: [feat/honest-sync-status]
    paths:
      - scripts/patch-sync-identity.py
      - .github/workflows/patch-sync-identity.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/honest-sync-status
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-sync-identity.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-sync-identity.py .github/workflows/patch-sync-identity.yml
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "feat(sync): lastCloudSyncAt + event after server ack"
          git push origin feat/honest-sync-status
