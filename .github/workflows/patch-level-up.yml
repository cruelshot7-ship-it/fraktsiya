name: Patch level-up flow
on:
  push:
    branches: [feat/level-up-flow]
    paths:
      - scripts/patch-level-up.py
      - .github/workflows/patch-level-up.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/level-up-flow
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-level-up.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-level-up.py .github/workflows/patch-level-up.yml
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "feat(ux): workout complete → food; shift check-in toasts"
          git push origin feat/level-up-flow
