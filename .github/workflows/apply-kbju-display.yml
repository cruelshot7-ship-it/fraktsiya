name: Apply KBJU display fix
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/patch-kbju-display.py
      - .github/workflows/apply-kbju-display.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-kbju-display.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/program-view.tsx src/components/app/nutrition-view.tsx
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(ui): KBJU shows logged food when target is 0"
          git push origin main
