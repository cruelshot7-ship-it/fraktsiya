name: Apply KBJU display fix
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/nutrition-view.tsx.b64
      - scripts/ci/program-view.tsx.b64.0
      - scripts/ci/program-view.tsx.b64.1
      - .github/workflows/apply-kbju-display.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode views
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          nut = Path("scripts/ci/nutrition-view.tsx.b64").read_text().strip()
          Path("src/components/app/nutrition-view.tsx").write_bytes(base64.b64decode(nut))
          a = Path("scripts/ci/program-view.tsx.b64.0").read_text().strip()
          b = Path("scripts/ci/program-view.tsx.b64.1").read_text().strip()
          Path("src/components/app/program-view.tsx").write_bytes(base64.b64decode(a + b))
          print("decoded ok")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/program-view.tsx src/components/app/nutrition-view.tsx
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(ui): KBJU shows logged food when target is 0"
          git push origin main
