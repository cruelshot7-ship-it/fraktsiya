name: Patch ABC screens
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-abc-screens.py
      - .github/workflows/patch-abc-screens.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-abc-screens.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-abc-screens.py .github/workflows/patch-abc-screens.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(ui): A Today summary, B client badges/names/multi-cancel, C slot confirm"
          git push origin main
