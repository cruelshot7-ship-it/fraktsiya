name: P0 balance fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p0-balance-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch studio-sync balance ownership
        run: |
          set -e
          FILE=src/lib/studio-sync.ts
          if ! grep -q 'sessionsLeft: incomingSelf.sessionsLeft' "$FILE"; then
            echo "already patched or pattern absent"
            grep -n 'server-owned\|sessionsLeft' "$FILE" | head -20 || true
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/lib/studio-sync.ts")
          t = p.read_text()
          lines = t.splitlines(keepends=True)
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if "sessionsLeft: incomingSelf.sessionsLeft" in line:
                  # skip this and optional following ledger line
                  i += 1
                  if i < len(lines) and "ledger: incomingSelf.ledger" in lines[i]:
                      i += 1
                  # insert comment once after streak line (already in out)
                  if out and "server-owned" not in "".join(out[-3:]):
                      out.append("    // sessionsLeft, ledger, packExpiresAt are server-owned: a client push never changes them\n")
                  continue
              if "ledger: incomingSelf.ledger" in line and "incomingSelf" in line:
                  i += 1
                  continue
              out.append(line)
              i += 1
          p.write_text("".join(out))
          assert "sessionsLeft: incomingSelf" not in p.read_text()
          print("patched", p.stat().st_size)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/studio-sync.ts
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "fix(P0.2): sessionsLeft/ledger server-owned — client cannot change balance"
          git push
