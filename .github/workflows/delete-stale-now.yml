name: Delete stale feature branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-stale-now.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for b in feat/persist-workout-local feat/program-presets; do
            # only delete persist-workout-local (merged); keep program-presets until merged
            if [ "$b" = "feat/persist-workout-local" ]; then
              git push origin --delete "$b" 2>/dev/null && echo deleted $b || echo skip $b
            fi
          done
          rm -f .github/workflows/delete-stale-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: drop one-shot delete-stale-now workflow"
          git push origin main
