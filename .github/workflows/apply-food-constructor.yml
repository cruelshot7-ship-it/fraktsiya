name: Apply food constructor
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/patch-food-constructor.py
      - scripts/ci/nutrition-view.tsx.b64.0
      - scripts/ci/nutrition-view.tsx.b64.1
      - .github/workflows/apply-food-constructor.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-food-constructor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/studio.ts src/components/app/nutrition-view.tsx
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(food): constructor suggests menu items by remaining macros"
          git push origin main
