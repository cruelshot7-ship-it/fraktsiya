name: Patch CTA priority
on:
  push:
    branches: [feat/p1-cta-priority]
    paths:
      - scripts/patch-cta-priority.py
      - .github/workflows/patch-cta-priority.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-cta-priority
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-cta-priority.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-cta-priority.py .github/workflows/patch-cta-priority.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(ux): training day CTA opens program not schedule"
          git push origin feat/p1-cta-priority
