name: Apply food slot fix
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/patch-food-slot-default.py
      - .github/workflows/apply-food-slot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-food-slot-default.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/nutrition-view.tsx src/data/studio.ts
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(food): constructor shows full menu; expand MEALS kinds"
          git push origin main
