name: peer-diag
on:
  push:
    branches: [fix/remove-legacy-peer-deps]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-peer-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: peer deps of tanstack router-plugin and start-plugin-core
        run: |
          set +e
          mkdir -p diag
          for v in $(npm view @tanstack/router-plugin versions --json | tr -d '[]", ' | grep '^1\.1\(68\|69\|70\|71\)\.' | tail -40); do
            echo "router-plugin@$v peer: $(npm view @tanstack/router-plugin@$v peerDependencies --json 2>/dev/null | tr -d '\n ')" >> diag/peers.txt
            echo "router-plugin@$v deps: $(npm view @tanstack/router-plugin@$v dependencies --json 2>/dev/null | tr -d '\n ')" >> diag/peers.txt
          done
          for v in $(npm view @tanstack/start-plugin-core versions --json | tr -d '[]", ' | grep '^1\.17[01]\.' | tail -12); do
            echo "start-plugin-core@$v deps: $(npm view @tanstack/start-plugin-core@$v dependencies --json 2>/dev/null | tr -d '\n ')" >> diag/peers.txt
          done
          echo "react-router versions 1.170.x: $(npm view @tanstack/react-router versions --json | tr -d '[]", ' | grep '^1\.170\.' | tr '\n' ' ')" >> diag/peers.txt
          exit 0
      - name: commit diag
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f diag
          git commit -m "diag: peer deps" >/dev/null 2>&1 || exit 0
          git push origin HEAD:fix/remove-legacy-peer-deps
