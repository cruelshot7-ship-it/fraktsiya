name: Fix byPhone exact
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-byphone-exact.py
      - .github/workflows/fix-byphone-exact.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix-byphone-exact.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/fix-byphone-exact.py .github/workflows/fix-byphone-exact.yml .github/workflows/fix-byphone.yml scripts/ss-fix.b64.* .github/workflows/apply-ss-fix.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(sync): complete byPhone ternary in pullStudio"
          git push origin main
