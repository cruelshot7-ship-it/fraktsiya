name: Cleanup ABC junk
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-abc-junk.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-abc-screens.py
          rm -f .github/workflows/patch-abc-screens.yml
          rm -f .github/workflows/cleanup-abc-junk.yml
          git add -A
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "chore: remove failed patch-abc one-shot workflow and script"
          git push origin main
