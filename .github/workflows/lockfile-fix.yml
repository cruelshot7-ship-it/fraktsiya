name: lockfile-fix

on:
  push:
    branches: [fix/lockfile]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install and verify
        run: |
          set +e
          mkdir -p diag
          npm install --no-audit --no-fund > diag/install.txt 2>&1
          echo "install-exit=$?" >> diag/install.txt
          npm ls @tanstack/react-router > diag/ls-router.txt 2>&1
          npm run typecheck > diag/typecheck.txt 2>&1
          echo "exit=$?" > diag/typecheck-exit.txt
          npm test > diag/test.txt 2>&1
          echo "exit=$?" > diag/test-exit.txt
          ls -la > diag/ls.txt 2>&1
          git status --short > diag/status.txt 2>&1
          exit 0
      - name: commit lockfile and diagnostics
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          ls package-lock.json > diag/lock-exists.txt 2>&1 || true
          git add -f diag
          git add -f package.json package-lock.json .npmrc || true
          git status --short > diag/status2.txt
          git add -f diag/status2.txt
          git commit -m "chore(deps): package-lock.json и диагностика" > diag/commit.txt 2>&1
          echo "commit-exit=$?" >> diag/commit.txt
          git push origin HEAD:fix/lockfile
