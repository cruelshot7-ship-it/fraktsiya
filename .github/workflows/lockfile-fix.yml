name: lockfile-fix

on:
  push:
    branches: [fix/lockfile]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install and verify
        run: |
          set +e
          mkdir -p diag
          npm install --no-audit --no-fund > diag/install.txt 2>&1 || echo "install-exit=$?" >> diag/install.txt
          npm ls @tanstack/react-router > diag/ls-router.txt 2>&1 || true
          npm run typecheck > diag/typecheck.txt 2>&1; echo "exit=$?" > diag/typecheck-exit.txt || true
          npm test > diag/test.txt 2>&1; echo "exit=$?" > diag/test-exit.txt || true
      - name: commit lockfile and diagnostics
        run: |
          set +e
          git config user.name github-actions
          git config user.email actions@github.com
          git add package.json package-lock.json diag
          git commit -m "chore(deps): package-lock.json и точный пин @tanstack/react-router 1.170.41" || exit 0
          git push
