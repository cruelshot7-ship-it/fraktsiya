name: Patch D food
on:
  push:
    branches: [feat/food-constructor-d]
    paths:
      - scripts/patch-d-food.py
      - .github/workflows/patch-d-food.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/food-constructor-d
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-d-food.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-d-food.py .github/workflows/patch-d-food.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(food): D 2-col constructor + repeat yesterday"
          git push origin feat/food-constructor-d
