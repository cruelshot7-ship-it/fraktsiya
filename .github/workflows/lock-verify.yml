name: lock-verify
on:
  push:
    branches: [fix/remove-legacy-peer-deps]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-peer-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install, typecheck, test
        run: |
          set +e
          mkdir -p diag
          npm install --no-audit --no-fund > diag/install.txt 2>&1
          echo "install-exit=$?" >> diag/install.txt
          npm run typecheck > diag/typecheck.txt 2>&1
          echo "typecheck-exit=$?" > diag/typecheck-exit.txt
          npm test > diag/test.txt 2>&1
          echo "test-exit=$?" > diag/test-exit.txt
          exit 0
      - name: commit lock and diag
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f diag package.json package-lock.json
          git commit -m "chore(deps): lock после пина router-plugin 1.168.42, без legacy-peer-deps" >/dev/null 2>&1 || true
          git push origin HEAD:fix/remove-legacy-peer-deps
