name: Patch client menu inline
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-client-menu-inline.py
      - .github/workflows/patch-client-menu-inline.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-client-menu-inline.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-client-menu-inline.py .github/workflows/patch-client-menu-inline.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(clients): action menu under card, cancel bound to next slot"
          git push origin main
