name: Apply join coach fix
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/patch-join-coach.py
      - .github/workflows/apply-join-coach.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-join-coach.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/studio-sync.ts src/lib/telegram-bot.server.ts
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(join): default coachFromStart to main trainer when no c_ link"
          git push origin main
