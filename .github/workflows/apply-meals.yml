name: Apply meals expand
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/patch-meals-only.py
      - .github/workflows/apply-meals.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-meals-only.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/studio.ts
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(food): expand MEALS with slots for constructor"
          git push origin main
