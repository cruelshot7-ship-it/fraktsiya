name: Apply schedule DS
on:
  push:
    branches: [design/schedule-ds]
    paths:
      - scripts/ci/patch-schedule-ds.py
      - .github/workflows/apply-schedule-ds.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/schedule-ds
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-schedule-ds.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/client-slots.tsx
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "design(schedule): ds-slot, ds-day, ds-cta on client slots"
          git push origin HEAD:design/schedule-ds
