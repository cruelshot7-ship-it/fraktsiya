name: Delete stale branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-stale-branches.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="cruelshot7-ship-it/fraktsiya"
          BRANCHES="
            design/schedule-ds
            fix/nav-shell
            fix/ci-green
            fix/sync-marks-and-dismissals
            fix/bookings-sort
            fix/ready
            fix/types
          "
          for b in $BRANCHES; do
            echo "Deleting $b ..."
            code=$(curl -sS -o /tmp/out -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/git/refs/heads/$b")
            echo "  HTTP $code"
            cat /tmp/out || true
            echo
          done
