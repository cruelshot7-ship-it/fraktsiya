name: Delete stale branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-stale-branches.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete stale remote branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for b in cruelshot7-ship-it-patch-1 tmp-check-delete; do
            if git ls-remote --heads origin "$b" | grep -q .; then
              git push origin --delete "$b" && echo "deleted $b" || echo "fail $b"
            else
              echo "no $b"
            fi
          done
          rm -f .github/workflows/delete-stale-branches.yml
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: drop one-shot delete-stale-branches workflow"
          git push origin main
