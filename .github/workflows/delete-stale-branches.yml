name: Delete stale feature branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-stale-branches.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git push origin --delete feat/client-visit-flow 2>/dev/null || true
          git push origin --delete feat/honest-sync-clean 2>/dev/null || true
          git push origin --delete feat/honest-sync-status 2>/dev/null || true
          rm -f .github/workflows/delete-stale-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: drop one-shot delete-stale-branches workflow"
          git push origin main
