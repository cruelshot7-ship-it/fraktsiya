name: Patch hide coach admin
on:
  push:
    branches: [feat/hide-coach-admin]
    paths:
      - scripts/patch-hide-coach-admin.py
      - .github/workflows/patch-hide-coach.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hide-coach-admin
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-hide-coach-admin.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-hide-coach-admin.py .github/workflows/patch-hide-coach.yml
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "feat(ux): coach team admin collapsed under Команда тренеров"
          git push origin feat/hide-coach-admin
