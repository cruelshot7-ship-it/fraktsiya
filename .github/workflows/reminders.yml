name: reminders

# Напоминания клиентам по расписанию: раз в 15 минут дёргаем /api/reminders.
# Нужны секреты репозитория: CRON_SECRET (то же значение, что в Vercel) и,
# по желанию, переменная APP_URL (по умолчанию https://ruksha.vercel.app).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Вызвать напоминания
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://ruksha.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET не задан"; exit 1; fi
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/reminders"
