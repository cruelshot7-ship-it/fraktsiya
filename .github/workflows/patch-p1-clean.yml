name: Patch P1 clean
on:
  push:
    branches: [feat/p1-clean]
    paths:
      - scripts/patch-p1-clean.py
      - .github/workflows/patch-p1-clean.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p1-clean
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-p1-clean.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-p1-clean.py .github/workflows/patch-p1-clean.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(ux): join starter pack + client schedule tabs"
          git push origin feat/p1-clean
