name: Fix pushStudio find
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-pushstudio-find.py
      - .github/workflows/fix-pushstudio-find.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix-pushstudio-find.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/fix-pushstudio-find.py .github/workflows/fix-pushstudio-find.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(sync): close incomplete clients.find in pushStudio"
          git push origin main
