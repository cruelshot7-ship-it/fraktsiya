name: Patch program presets
on:
  push:
    branches: [feat/program-presets]
    paths:
      - scripts/patch-program-presets.py
      - scripts/preset-part-0.txt
      - scripts/preset-part-1.txt
      - scripts/preset-part-2.txt
      - scripts/preset-part-3.txt
      - .github/workflows/patch-program-presets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/program-presets
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-program-presets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-program-presets.py scripts/preset-part-*.txt .github/workflows/patch-program-presets.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(program): presets beginner/experienced/fullbody/upper/lower"
          git push origin feat/program-presets
