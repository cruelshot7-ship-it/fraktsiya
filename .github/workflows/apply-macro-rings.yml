name: Apply macro rings fix
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/patch-macro-rings.py
      - .github/workflows/apply-macro-rings.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/ci/patch-macro-rings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/program-view.tsx
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "fix(ui): Macro rings fill by eaten/target with strokeDashoffset"
          git push origin main
