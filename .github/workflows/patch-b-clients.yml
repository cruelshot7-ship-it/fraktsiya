name: Patch B clients
on:
  push:
    branches: [feat/clients-polish-b]
    paths:
      - scripts/patch-b-clients.py
      - .github/workflows/patch-b-clients.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clients-polish-b
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-b-clients.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-b-clients.py .github/workflows/patch-b-clients.yml
          git add -A
          if git diff --staged --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(clients): B shortName, report badges, multi-slot cancel"
          git push origin feat/clients-polish-b
