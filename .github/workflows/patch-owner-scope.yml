name: Patch owner scope
on:
  push:
    branches: [fix/owner-scope-clientsheet]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-scope-clientsheet
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-owner-scope.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-owner-scope.py .github/workflows/patch-owner-scope.yml
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "fix(ux): move coach team block out of ClientSheetBody (owner scope)"
          git push origin fix/owner-scope-clientsheet
