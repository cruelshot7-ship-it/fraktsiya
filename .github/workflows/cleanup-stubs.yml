name: Cleanup stubs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stubs.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove one-shot patches, blobs, apply workflows
        run: |
          set -e
          rm -rf scripts/ci
          rm -f scripts/restore-studio-sync.mjs
          rm -f scripts/expand-studio-store.mjs
          rm -f scripts/studio-store.b64 scripts/studio-store.b64.*
          rm -rf scripts/studio-sync-embed
          rm -f .vercel-redeploy
          rm -f .github/workflows/apply-food-constructor.yml
          rm -f .github/workflows/apply-food-slot.yml
          rm -f .github/workflows/apply-meals.yml
          rm -f .github/workflows/vercel-redeploy.yml
          # remove this workflow too after run
          rm -f .github/workflows/cleanup-stubs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo nothing; exit 0; fi
          git commit -m "chore: remove one-shot CI patches, b64 stubs, apply workflows"
          git push origin main
