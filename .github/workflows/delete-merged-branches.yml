name: Delete merged branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-merged-branches.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete merged branches
        run: |
          for b in feat/clients-polish-b feat/slot-confirm-c hotfix/slots-jsx; do
            git push origin --delete "$b" 2>/dev/null && echo "deleted $b" || echo "skip $b"
          done
          rm -f .github/workflows/delete-merged-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: drop one-shot delete-merged-branches workflow"
          git push origin main
