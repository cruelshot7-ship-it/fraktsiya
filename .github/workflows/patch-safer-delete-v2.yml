name: Patch safer delete v2
on:
  push:
    branches: [feat/safer-delete-v2]
    paths:
      - scripts/patch-safer-delete.py
      - .github/workflows/patch-safer-delete-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/safer-delete-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/patch-safer-delete.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch-safer-delete.py .github/workflows/patch-safer-delete-v2.yml
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "feat(ux): delete client requires typing first name"
          git push origin feat/safer-delete-v2
