[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# HOST only. Do not pin PORT — Railway assigns it and proxies to that port.
[env]
HOST = "0.0.0.0"
VITE_AUTH_ENABLED = "false"
